<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0a0e18; }
  * { box-sizing: border-box; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
           font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; }
  .abs { position: absolute; }
  .bloom { position: absolute; border-radius: 50%; filter: blur(90px); }
  .center { left: 60px; width: 960px; text-align: center; }
  .h1 { font-size: 80px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.05; }
  .h2 { font-size: 88px; font-weight: 800; letter-spacing: -2px; line-height: 1.02; }
  .grad { background: linear-gradient(92deg, #d946ef 0%, #8b5cf6 45%, #4cc2ff 100%);
          -webkit-background-clip: text; background-clip: text; color: transparent; }
  .chore { left: 110px; width: 860px; height: 100px; border-radius: 22px; display: flex; align-items: center;
           gap: 28px; padding: 0 34px; font-size: 44px; font-weight: 600;
           background: rgba(255,255,255,.82); border: 2px solid rgba(15,27,45,.08);
           box-shadow: 0 10px 30px rgba(15,40,80,.10); color: #0f1b2d; }
  .box { width: 46px; height: 46px; border-radius: 10px; border: 4px solid #9aa9bd; flex: none; }
  /* Fenêtre de l'application (style Windows 11 / WPF-UI) */
  #win { left: 50px; top: 190px; width: 980px; height: 1190px; border-radius: 16px; overflow: hidden;
         box-shadow: 0 40px 120px rgba(0,0,0,.40), 0 0 0 1.5px rgba(128,128,128,.25); }
  #winbar { height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 22px; font-size: 23px; }
  #winbar .ttl { flex: 1; }
  #winbar .ctl { letter-spacing: 30px; font-size: 22px; }
  #winhead { padding: 18px 40px 0; }
  #winhead .t { font-size: 54px; font-weight: 600; letter-spacing: -.5px; }
  #winhead .s { font-size: 24px; margin-top: 4px; }
  #track { position: absolute; left: 40px; right: 40px; top: 200px; height: 5px; border-radius: 3px; }
  #bar { height: 5px; border-radius: 3px; width: 0; }
  #rows { position: absolute; left: 40px; right: 40px; top: 232px; }
  .row { position: relative; height: 104px; margin-bottom: 12px; border-radius: 10px; display: flex; align-items: center;
         padding: 0 26px; gap: 22px; }
  .row .gl { width: 40px; height: 40px; flex: none; }
  .row .st { width: 38px; height: 38px; flex: none; }
  .row .nm { font-size: 31px; font-weight: 500; display: flex; align-items: center; gap: 14px; }
  .row .dt { font-size: 22px; margin-top: 2px; white-space: nowrap; }
  .row .rs { margin-left: auto; font-size: 25px; white-space: nowrap; }
  .tag { font-size: 18px; font-weight: 700; padding: 3px 12px; border-radius: 999px; letter-spacing: .5px; }
  .chip { font-size: 40px; font-weight: 700; padding: 16px 28px; border-radius: 999px; white-space: nowrap; }
  /* Barre des tâches */
  #tb { left: 40px; width: 1000px; top: 1000px; height: 168px; border-radius: 30px;
        background: rgba(32,36,48,.78); border: 2px solid rgba(255,255,255,.12);
        box-shadow: 0 30px 90px rgba(0,0,0,.45); }
  .pin { position: absolute; top: 24px; width: 120px; height: 120px; border-radius: 22px; display: flex;
         align-items: center; justify-content: center; }
  .pin .dot { position: absolute; bottom: 4px; left: 50%; width: 22px; height: 6px; margin-left: -11px;
              border-radius: 3px; background: #9aa4b5; }
  .plbl { position: absolute; top: 1200px; width: 170px; text-align: center; color: #f2f6fb; }
  .plbl .n { font-size: 30px; font-weight: 800; color: #4cc2ff; }
  .plbl .l { font-size: 30px; font-weight: 600; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="abs" style="inset:0"></div>
  <div id="b1" class="bloom" style="width:900px;height:900px"></div>
  <div id="b2" class="bloom" style="width:800px;height:800px"></div>
  <div id="b3" class="bloom" style="width:700px;height:700px"></div>

  <!-- Scène 1 -->
  <div id="s1h1" class="abs center h1" style="top:330px" data-t="hook1"></div>
  <div id="chores"></div>
  <div id="s1h2" class="abs center h2" style="top:1235px;color:#0067c0" data-t="hook2"></div>

  <!-- Scène 2 -->
  <div id="icon" class="abs" style="left:430px;top:640px;width:220px;height:290px">
    <div id="iconsel" class="abs" style="inset:-18px -60px;border-radius:14px;background:rgba(0,120,212,.16);border:2px solid rgba(0,120,212,.55)"></div>
    <img class="abs" style="left:10px;top:0" width="200" height="200" src="logos/roboconfig.png" alt="">
    <div id="iconlbl" class="abs" style="left:-90px;width:400px;top:212px;text-align:center;font-size:38px;font-weight:600;color:#0f1b2d">RoboConfigurator.exe</div>
  </div>
  <div id="rip1" class="abs" style="border-radius:50%;border:5px solid #0078d4"></div>
  <div id="rip2" class="abs" style="border-radius:50%;border:5px solid #0078d4"></div>
  <div id="s2title" class="abs center h2" style="top:980px"><span class="grad">Robo's Ultimate<br>Windows Configurator</span></div>
  <div id="s2sub" class="abs center" style="top:1215px;font-size:54px;font-weight:600" data-t="sub"></div>

  <!-- Scène 3 : l'application -->
  <div id="win" class="abs">
    <div id="winbar">
      <img width="30" height="30" src="logos/roboconfig.png" alt="">
      <div class="ttl">Robo's Ultimate Windows Configurator</div>
      <div class="ctl">—☐✕</div>
    </div>
    <div id="winhead">
      <div class="t" data-t="winTitle"></div>
      <div class="s" data-t="winSub"></div>
    </div>
    <div id="track"><div id="bar"></div></div>
    <div id="rows"></div>
  </div>
  <div id="chips" class="abs" style="left:30px;width:1020px;top:1440px;display:flex;flex-wrap:wrap;justify-content:center;gap:18px"></div>

  <!-- Scène 4 : la barre des tâches (v2.2) -->
  <div id="s4new" class="abs" style="left:240px;width:600px;top:330px;text-align:center">
    <span style="display:inline-block;font-size:38px;font-weight:800;padding:14px 34px;border-radius:999px;background:rgba(76,194,255,.16);color:#4cc2ff;border:2px solid rgba(76,194,255,.5)" data-t="newPill"></span>
  </div>
  <div id="s4h" class="abs center h1" style="top:470px;color:#f2f6fb" data-t="tbTitle"></div>
  <div id="tb" class="abs"></div>
  <div id="plbls"></div>
  <div id="s4c" class="abs center" style="top:1400px;font-size:40px;font-weight:600;color:#c7d3e3;line-height:1.3" data-t="tbCaption"></div>

  <!-- Scène 5 -->
  <div id="s5title" class="abs center" style="top:470px;font-size:110px;font-weight:800;letter-spacing:-3px;line-height:1"><span class="grad">Robo's<br>Ultimate<br>Windows<br>Configurator</span></div>
  <div id="s5btn" class="abs" style="left:150px;width:780px;top:990px;height:118px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:22px;background:#0078d4;color:#fff;font-size:50px;font-weight:700;box-shadow:0 20px 60px rgba(0,120,212,.45)">
    <img width="64" height="64" src="logos/roboconfig.png" alt="" style="border-radius:14px;box-shadow:0 0 0 3px rgba(255,255,255,.85)">
    RoboConfigurator.exe
  </div>
  <div id="s5os" class="abs center" style="top:1150px;font-size:42px;font-weight:600;color:#c7d3e3" data-t="outroOs"></div>
  <div id="s5lang" class="abs center" style="top:1218px;font-size:34px;font-weight:600;color:#4cc2ff">English · Français</div>
  <div id="s5gh" class="abs center" style="top:1320px;color:#f2f6fb">
    <div style="font-family:'Cascadia Mono',Consolas,monospace;font-size:46px;font-weight:700">github.com/Robocnop</div>
    <div style="font-family:'Cascadia Mono',Consolas,monospace;font-size:29px;color:#8fa3bd;margin-top:10px">Robo-s-Ultimate-Windows-configurator</div>
  </div>

  <!-- Curseur -->
  <svg id="cursor" class="abs" width="70" height="90" viewBox="0 0 28 36" style="left:0;top:0">
    <path d="M2 2v27l7-6.5 4.5 10.5 4.5-2-4.5-10H23z" fill="#fff" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>
</div>

<script>
const DURATION = 24.3;
// Langue : video.html?lang=fr pour la version française (anglais par défaut)
const LANG = new URLSearchParams(location.search).get('lang') === 'fr' ? 'fr' : 'en';
document.documentElement.lang = LANG;
const S = {
  en: {
    hook1: 'Windows just<br>finished installing.', hook2: '…and you do it<br>all by hand?', sub: 'One double-click.<br>It does the rest.',
    chores: ['Install your software', 'Strip the ads and bloatware', 'Uninstall Edge', 'Sort out the taskbar', 'Install Office'],
    winTitle: 'Setting up', winSub: 'The PC is setting itself up. Only Ninite asks you to click “Close”.',
    status: ['Waiting', 'In progress', 'Done'], tag: 'NEW',
    steps: [
      ['Ninite', 'Installing your software...', 'Done'],
      ['CrapFixer', null, 'Done'],
      ['Uninstall Microsoft Edge', 'Official uninstaller...', 'Uninstalled, WebView2 kept'],
      ['Taskbar', 'File Explorer, Firefox, Terminal, PowerShell', 'Pinned at next sign-in'],
      ['Microsoft Office', 'Installing Office...', 'Installed'],
      ['Windows activation', 'Checking...', 'Windows is activated'],
      ['PC name', '...', 'Will be named “LIVING-PC”'],
      ['PC report', '...', 'Copied to the desktop'],
    ],
    tweak: 'Tweak', removed: 'App removed: ',
    chips: ['47 tweaks', 'dark theme', 'Edge gone', 'Office installed'],
    newPill: 'New', tbTitle: 'Your taskbar,<br><span class="grad">sorted for you.</span>',
    pins: ['File Explorer', 'Firefox', 'Terminal', 'PowerShell'],
    tbCaption: 'The Windows default pins are gone.<br>Ready at your next sign-in.',
    outroOs: 'Windows 10 &amp; 11 · one exe, nothing to install',
  },
  fr: {
    hook1: 'Windows vient<br>de s\'installer.', hook2: '…et tu fais tout<br>à la main ?', sub: 'Un double-clic.<br>Il fait le reste.',
    chores: ['Installer les logiciels', 'Virer les pubs et le bloatware', 'Désinstaller Edge', 'Ranger la barre des tâches', 'Installer Office'],
    winTitle: 'Configuration en cours', winSub: 'Le PC se configure tout seul. Seul Ninite demande de cliquer sur « Close ».',
    status: ['En attente', 'En cours', 'Terminée'], tag: 'NOUVEAU',
    steps: [
      ['Ninite', 'Installation des logiciels...', 'Terminée'],
      ['CrapFixer', null, 'Terminée'],
      ['Désinstaller Microsoft Edge', 'Désinstalleur officiel...', 'Désinstallé, WebView2 conservé'],
      ['Barre des tâches', 'Explorateur, Firefox, Terminal, PowerShell', 'Épinglé à la prochaine session'],
      ['Microsoft Office', 'Installation d\'Office...', 'Installé'],
      ['Activation de Windows', 'Vérification...', 'Windows est activé'],
      ['Nom du PC', '...', 'S\'appellera « PC-SALON »'],
      ['Rapport du poste', '...', 'Copié sur le Bureau'],
    ],
    tweak: 'Réglage', removed: 'Appli supprimée : ',
    chips: ['47 tweaks', 'thème sombre', 'Edge viré', 'Office installé'],
    newPill: 'Nouveau', tbTitle: 'La barre des tâches,<br><span class="grad">rangée pour toi.</span>',
    pins: ['Explorateur', 'Firefox', 'Terminal', 'PowerShell'],
    tbCaption: 'Les épingles de Windows dégagent.<br>Prêt dès la prochaine session.',
    outroOs: 'Windows 10 &amp; 11 · un seul exe, rien à installer',
  },
}[LANG];
document.querySelectorAll('[data-t]').forEach(e => { e.innerHTML = S[e.dataset.t]; });
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, s, d) => clamp((t - s) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const mix = (c1, c2, t) => `rgb(${c1.map((v, i) => Math.round(lerp(v, c2[i], t))).join(',')})`;

// Élément qui entre à `a` (durée da) et sort à `b` (durée db). dy = glissement vertical.
function show(el, t, a, da, b, db, dy = 40, dx = 0, sc = 0) {
  const p = eOut(prog(t, a, da)), q = eInOut(prog(t, b, db));
  const o = p * (1 - q);
  el.style.opacity = o;
  el.style.visibility = o < .002 ? 'hidden' : 'visible';
  el.style.transform = `translate(${(1 - p) * dx}px, ${(1 - p) * dy - q * dy}px) scale(${1 - (1 - p) * sc})`;
  return o;
}

// ---------------------------------------------------------------------------
// Scène 1
// ---------------------------------------------------------------------------
const CHORES = S.chores;
const choreEls = CHORES.map((txt, i) => {
  const d = document.createElement('div');
  d.className = 'abs chore';
  d.style.top = (560 + i * 124) + 'px';
  d.innerHTML = `<div class="box"></div><span>${txt}</span>`;
  $('chores').appendChild(d);
  return d;
});

// ---------------------------------------------------------------------------
// Scène 3 : étapes réelles de l'application (MainWindow.xaml.cs / Engine.cs)
// ---------------------------------------------------------------------------
const G = 'fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"';
const GLYPH = {
  apps: `<svg viewBox="0 0 32 32" ${G}><rect x="5" y="5" width="9" height="9" rx="1.5"/><rect x="5" y="18" width="9" height="9" rx="1.5"/><rect x="18" y="18" width="9" height="9" rx="1.5"/><path d="M22.5 5v9M18 9.5h9"/></svg>`,
  broom: `<svg viewBox="0 0 32 32" ${G}><path d="M26 5L15 16"/><path d="M15 16l-4-1-6 6 6 6 6-6-1-4z"/><path d="M9 23l3-3M12 25l2-2"/></svg>`,
  globe: `<svg viewBox="0 0 32 32" ${G}><circle cx="16" cy="16" r="11"/><path d="M5 16h22M16 5c-4 4-4 18 0 22M16 5c4 4 4 18 0 22"/></svg>`,
  pin: `<svg viewBox="0 0 32 32" ${G}><path d="M19 4l9 9-4 1-5 5 1 5-2 2-5-5-7 7M19 4l-1 4-5 5-5-1-2 2 5 5"/></svg>`,
  doc: `<svg viewBox="0 0 32 32" ${G}><path d="M8 4h11l6 6v18H8z"/><path d="M19 4v6h6"/></svg>`,
  shield: `<svg viewBox="0 0 32 32" ${G}><path d="M16 4l10 4v7c0 7-5 11-10 13C11 26 6 22 6 15V8z"/><path d="M12 16l3 3 5-6"/></svg>`,
  rename: `<svg viewBox="0 0 32 32" ${G}><rect x="4" y="9" width="24" height="14" rx="2"/><path d="M16 5v22M13 5h6M13 27h6"/></svg>`,
  report: `<svg viewBox="0 0 32 32" ${G}><path d="M8 4h11l6 6v18H8z"/><path d="M12 15h9M12 19h9M12 23h6"/></svg>`,
};
// [glyphe, nom, début, fin, détails en cours [t, texte] (null = CrapFixer), détail final, nouveau ?]
const TIMES = [[7.95, 8.6], [8.6, 11.4], [11.4, 12.0], [12.0, 12.55], [12.55, 13.05], [13.05, 13.35], [13.35, 13.55], [13.55, 13.8]];
const GLYPHS = ['apps', 'broom', 'globe', 'pin', 'doc', 'shield', 'rename', 'report'];
const STEPS = S.steps.map(([name, running, final], i) =>
  [GLYPHS[i], name, TIMES[i][0], TIMES[i][1], running === null ? null : [[TIMES[i][0], running]], final, i === 3]);
const TWEAKS = 47, CF_START = 8.6, CF_END = 10.95;
const DARK_TWEAK = 23;
const tweakTime = n => lerp(CF_START + .1, CF_END, (n - 1) / (TWEAKS - 1));
const T_DARK = tweakTime(DARK_TWEAK);
const TWEAK_NAMES = { 3: 'Disable Lock Screen Ads', 9: 'Disable Widgets', 15: 'Left-align Taskbar', 18: 'Disable Bing Search', 23: 'Enable Dark Theme' };
function cfDetail(t) {
  if (t >= CF_END + .2) return S.removed + 'Candy Crush Saga';
  if (t >= CF_END) return S.removed + 'Skype';
  let n = 0;
  for (let k = 1; k <= TWEAKS; k++) if (t >= tweakTime(k)) n = k;
  let name = '';
  for (const k in TWEAK_NAMES) if (n >= +k) name = TWEAK_NAMES[k];
  return `${S.tweak} ${Math.max(1, n)}/${TWEAKS}` + (name ? ` · ${name}` : '');
}

const rowEls = STEPS.map(([gl, name, , , , , isNew]) => {
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = `<div class="gl">${GLYPH[gl]}</div>
    <svg class="st" viewBox="0 0 38 38"><circle class="ring" cx="19" cy="19" r="15" fill="none" stroke-width="2.6"/>
      <circle class="spin" cx="19" cy="19" r="15" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="30 200"/>
      <path class="chk" d="M12 19.5l5 5 9-10" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><div class="nm">${name}${isNew ? `<span class="tag">${S.tag}</span>` : ''}</div><div class="dt"></div></div>
    <div class="rs"></div>`;
  $('rows').appendChild(d);
  return d;
});

const CHIPS = [[S.chips[0], tweakTime(30)], [S.chips[1], T_DARK + .3], [S.chips[2], 12.0], [S.chips[3], 13.05]];
const chipEls = CHIPS.map(([txt]) => {
  const d = document.createElement('div');
  d.className = 'chip';
  d.textContent = txt;
  $('chips').appendChild(d);
  return d;
});

// ---------------------------------------------------------------------------
// Scène 4 : la barre des tâches
// ---------------------------------------------------------------------------
// Vraies icônes, extraites de Windows (logos/*.png, 256 px) ; logo Windows 11 officiel (logos/windows.svg)
const img = (f, px) => `<img src="logos/${f}" width="${px}" height="${px}" alt="">`;
const ICON = {
  start: img('windows.svg', 72),
  edge: img('edge.png', 92), store: img('store.png', 92),
  explorer: img('explorer.png', 92), firefox: img('firefox.png', 92),
  terminal: img('terminal.png', 92), powershell: img('powershell.png', 92),
};
const PIN_W = 170, TB_X0 = 100;          // position (dans #tb) de chaque emplacement
const slotX = i => TB_X0 + i * PIN_W;
function mkPin(ic, slot, dot) {
  const d = document.createElement('div');
  d.className = 'pin';
  d.style.left = slotX(slot) + 'px';
  d.innerHTML = ICON[ic] + (dot ? '<div class="dot"></div>' : '');
  $('tb').appendChild(d);
  return d;
}
mkPin('start', 0, false);
const OLD = ['edge', 'store', 'explorer'].map((ic, i) => mkPin(ic, i + 1, false));
const T_DROP = 16.0;
const NEW = ['explorer', 'firefox', 'terminal', 'powershell'].map((ic, i) => [ic, S.pins[i]]);
const PIN_T = NEW.map((_, i) => 16.55 + i * .38);
const newEls = NEW.map(([ic], i) => mkPin(ic, i + 1, true));
const lblEls = NEW.map(([, name], i) => {
  const d = document.createElement('div');
  d.className = 'plbl';
  d.style.left = (40 + slotX(i + 1) + 60 - 85) + 'px';
  d.innerHTML = `<div class="n">${i + 1}</div><div class="l">${name}</div>`;
  $('plbls').appendChild(d);
  return d;
});

// Chronologie partagée avec la bande-son
window.DURATION = DURATION;
window.TIMELINE = {
  duration: DURATION,
  chores: CHORES.map((_, i) => .85 + i * .17),
  hook2: 1.95,
  clicks: [4.92, 5.12],
  termLines: [
    ...STEPS.map(s => ({ t: s[2], head: true })),
    ...STEPS.map(s => ({ t: s[3], head: false })),
    ...Array.from({ length: TWEAKS }, (_, k) => ({ t: tweakTime(k + 1), head: false })).filter((_, k) => k % 3 === 0),
  ].sort((a, b) => a.t - b.t),
  dark: T_DARK,
  chips: CHIPS.map(c => c[1]),
  drop: T_DROP,
  pins: PIN_T,
  outro: 20.35,
};

// ---------------------------------------------------------------------------
// Rendu : chaque image est une fonction pure du temps t
// ---------------------------------------------------------------------------
window.render = function (t) {
  const D = eInOut(prog(t, T_DARK, .65));             // 0 = thème clair, 1 = thème sombre
  const LIGHT = [236, 242, 249], DARK = [10, 14, 24];
  $('bg').style.background = mix(LIGHT, DARK, D);
  const txt = mix([15, 27, 45], [242, 246, 251], D);

  // Bloom façon Windows 11, dérive lente
  const bl = [
    ['b1', 180 + 60 * Math.sin(t * .35), -120 + 40 * Math.cos(t * .3), [76, 194, 255], [0, 103, 192]],
    ['b2', -250 + 50 * Math.cos(t * .28), 1150 + 60 * Math.sin(t * .33), [120, 170, 255], [124, 58, 237]],
    ['b3', 520 + 70 * Math.sin(t * .22 + 1), 1500 + 40 * Math.cos(t * .4), [180, 220, 255], [217, 70, 239]],
  ];
  for (const [id, x, y, c1, c2] of bl) {
    const e = $(id);
    e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.background = mix(c1, c2, D);
    e.style.opacity = lerp(.55, .38, D);
  }

  // Scène 1 : la corvée
  $('s1h1').style.color = txt;
  show($('s1h1'), t, .12, .45, 3.75, .35, 36);
  choreEls.forEach((el, i) => show(el, t, .85 + i * .17, .35, 3.72 + i * .04, .3, 30, -60));
  show($('s1h2'), t, 1.95, .4, 3.85, .3, 30, 0, .08);

  // Scène 2 : le double-clic
  const moveUp = eInOut(prog(t, 5.35, .5));
  const ico = $('icon');
  show(ico, t, 4.05, .4, 7.35, .3, 30, 0, .25);
  ico.style.transform += ` translateY(${-230 * moveUp}px) scale(${1 - .28 * moveUp})`;
  $('iconlbl').style.color = txt;
  $('iconsel').style.opacity = t >= 4.92 ? 1 : 0;
  const cm = eInOut(prog(t, 4.2, .65));
  const cx = lerp(930, 560, cm), cy = lerp(1560, 820, cm);
  const press = (t > 4.92 && t < 5.0) || (t > 5.12 && t < 5.2) ? .88 : 1;
  const cOut = prog(t, 5.3, .3);
  const cur = $('cursor');
  cur.style.opacity = t < 4.2 ? 0 : 1 - cOut;
  cur.style.transform = `translate(${cx}px, ${cy + cOut * 40}px) scale(${press})`;
  cur.style.transformOrigin = '0 0';
  [['rip1', 4.92], ['rip2', 5.12]].forEach(([id, t0]) => {
    const r = prog(t, t0, .55), e = $(id);
    const size = 60 + 260 * eOut(r);
    e.style.width = e.style.height = size + 'px';
    e.style.left = (575 - size / 2) + 'px'; e.style.top = (835 - size / 2) + 'px';
    e.style.opacity = t < t0 ? 0 : .7 * (1 - r);
  });
  show($('s2title'), t, 5.55, .5, 7.35, .3, 40, 0, .06);
  $('s2sub').style.color = txt;
  show($('s2sub'), t, 5.9, .45, 7.4, .3, 30);

  // Scène 3 : l'application (suit le thème de Windows, comme la vraie)
  show($('win'), t, 7.55, .5, 14.25, .35, 160);
  const W = {
    bg: mix([243, 243, 243], [32, 32, 32], D), bar: mix([238, 238, 238], [28, 28, 28], D),
    row: mix([251, 251, 251], [43, 43, 43], D), line: mix([229, 229, 229], [56, 56, 56], D),
    tx: mix([26, 26, 26], [255, 255, 255], D), tx2: mix([96, 96, 96], [197, 197, 197], D),
    acc: mix([0, 95, 184], [96, 205, 255], D), ok: mix([15, 123, 15], [108, 203, 95], D),
  };
  $('win').style.background = W.bg;
  $('winbar').style.background = W.bar; $('winbar').style.color = W.tx;
  $('winhead').style.color = W.tx;
  $('winhead').querySelector('.s').style.color = W.tx2;
  $('track').style.background = W.line;
  $('bar').style.background = W.acc;
  let done = 0;
  rowEls.forEach((el, i) => {
    const [, , a, b, details, final, isNew] = STEPS[i];
    const state = t >= b ? 2 : t >= a ? 1 : 0;
    if (t >= b) done += 1; else if (t >= a) done += (t - a) / (b - a);
    el.style.background = W.row;
    el.style.color = W.tx;
    el.querySelector('.gl').style.color = W.tx;
    const ring = el.querySelector('.ring'), spin = el.querySelector('.spin'), chk = el.querySelector('.chk');
    ring.style.stroke = state === 2 ? W.ok : W.tx2;
    ring.style.opacity = state === 1 ? 0 : 1;
    spin.style.stroke = W.acc;
    spin.style.opacity = state === 1 ? 1 : 0;
    spin.setAttribute('transform', `rotate(${t * 520} 19 19)`);
    const pc = back(prog(t, b, .3));
    chk.style.stroke = W.ok;
    chk.style.opacity = state === 2 ? 1 : 0;
    chk.setAttribute('transform', `translate(19 19) scale(${Math.max(0, pc)}) translate(-19 -19)`);
    let dt = S.status[0];
    if (state === 1) dt = details ? details.filter(d => t >= d[0]).pop()[1] : cfDetail(t);
    if (state === 2) dt = final;
    el.querySelector('.dt').textContent = dt;
    el.querySelector('.dt').style.color = W.tx2;
    const rs = el.querySelector('.rs');
    rs.textContent = S.status[state];
    rs.style.color = state === 1 ? W.acc : W.tx;
    if (isNew) {
      const tag = el.querySelector('.tag');
      tag.style.background = W.acc; tag.style.color = W.bg;
      const glow = t < a ? 0 : Math.max(0, 1 - prog(t, b + .3, .8));
      el.style.boxShadow = `0 0 0 ${3 * glow}px ${W.acc}, 0 0 ${40 * glow}px rgba(76,194,255,${.5 * glow})`;
    }
  });
  $('bar').style.width = (100 * done / STEPS.length) + '%';
  chipEls.forEach((el, i) => {
    show(el, t, CHIPS[i][1], .35, 14.2 + i * .03, .3, 24, 0, .15);
    el.style.color = txt;
    el.style.background = D < .5 ? 'rgba(0,120,212,.12)' : 'rgba(76,194,255,.14)';
    el.style.border = `2px solid ${D < .5 ? 'rgba(0,120,212,.35)' : 'rgba(76,194,255,.4)'}`;
  });

  // Scène 4 : la barre des tâches
  show($('s4new'), t, 14.45, .4, 19.9, .3, 24, 0, .2);
  show($('s4h'), t, 14.6, .45, 19.9, .3, 30);
  show($('tb'), t, 14.95, .5, 19.95, .3, 60);
  OLD.forEach((el, i) => {
    const q = eInOut(prog(t, T_DROP + i * .08, .4));
    el.style.opacity = 1 - q;
    el.style.transform = `translateY(${q * 140}px) rotate(${q * (i - 1) * 12}deg)`;
  });
  newEls.forEach((el, i) => {
    const p = back(prog(t, PIN_T[i], .4));
    el.style.opacity = clamp(p * 2);
    el.style.transform = `translateY(${(1 - p) * -90}px) scale(${.6 + .4 * Math.max(0, p)})`;
  });
  lblEls.forEach((el, i) => show(el, t, PIN_T[i] + .1, .35, 19.9, .3, 20));
  show($('s4c'), t, 18.15, .45, 19.95, .3, 24);

  // Scène 5 : outro
  show($('s5title'), t, 20.35, .6, 99, 1, 50, 0, .06);
  show($('s5btn'), t, 20.75, .45, 99, 1, 30, 0, .2);
  show($('s5os'), t, 21.05, .4, 99, 1, 24);
  show($('s5lang'), t, 21.2, .4, 99, 1, 24);
  show($('s5gh'), t, 21.3, .4, 99, 1, 24);
};
window.render(0);
</script>
</body>
</html>
